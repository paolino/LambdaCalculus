name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Native conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run native conformance
        run: |
          nix-shell --pure -I nixpkgs=flake:nixpkgs -p 'haskellPackages.ghcWithPackages (p: [ p.lens ])' --run './test/run-conformance'
